server:
  port: ${SERVER_PORT:8081} # padrão 8081, sobrescreve via env
  servlet:
    context-path: /api/v1

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  partner-service-url: ${PARTNER_SERVICE_URL:http://localhost:8083/api/v1}
  team-jwt-secret: ${AUTH_TEAM_JWT_SECRET:}
  notification-recipient-token: ${NOTIFICATION_RECIPIENT_TOKEN:}
  reception-claim-token: ${RECEPTION_CLAIM_TOKEN:}
  s02-enabled: ${AUTH_S02_ENABLED:false}
  mail:
    enabled: ${AUTH_MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@easypet.test}}

management:
  health:
    mail:
      enabled: ${AUTH_MAIL_ENABLED:false}

spring:
  application:
    name: auth-service

  config:
    import:
      - optional:file:.env[.properties]

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: 3000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}
            required: ${MAIL_STARTTLS_ENABLED:true}
          ssl:
            trust: ${MAIL_HOST:smtp.gmail.com}

  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000}

---

spring:
  config:
    activate:
      on-profile: "!homolog"

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
