server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: easypet-gateway

  config:
    import:
      - optional:file:.env[.properties]

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${ALLOWED_ORIGINS:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "Authorization"
              - "Content-Type"
              - "X-Requested-With"
              - "Idempotency-Key"
            allowCredentials: true

      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"

      routes:
        - id: auth-team-management
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/team/accesses,/api/v1/auth/team/accesses/{id},/api/v1/auth/team/invitations

        - id: auth-session
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/session
            - Method=GET

        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        - id: pet-service
          uri: ${PET_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/pets/**

        - id: partner-service
          uri: ${PARTNER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/partners/me,/api/v1/partners/catalog,/api/v1/partners/catalog/{id},/api/v1/partners/staff/**,/api/v1/partners/{id}/staff,/api/v1/partners/{id}/services/**,/api/v1/partners/{id}/reviews

        - id: partner-mutations
          uri: ${PARTNER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/partners,/api/v1/partners/{id}
            - Method=POST,PUT,DELETE

        - id: admin-partners
          uri: ${PARTNER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/admin/partners,/api/v1/admin/partners/{id}
            - Method=GET,HEAD

        - id: admin-partner-status
          uri: ${PARTNER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/admin/partners/{id}/active
            - Method=PATCH

        - id: admin-partner-status-history
          uri: ${PARTNER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/admin/partners/{id}/status-history
            - Method=GET

        - id: admin-auth-customers
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/admin/customers
            - Method=GET,HEAD

        - id: admin-auth-customer-status
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/admin/customers/{id}/active
            - Method=PATCH

        - id: reception-customers
          uri: ${PARTNER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/partners/me/customers
            - Method=GET,HEAD,POST

        - id: reception-customer-detail
          uri: ${PARTNER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/partners/me/customers/{id}
            - Method=GET,HEAD

        - id: reception-desk
          uri: ${PARTNER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/partners/me/desk
            - Method=GET

        - id: reception-claims
          uri: ${PARTNER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/partners/me/customers/{id}/claims,/api/v1/partners/customer-claims/redeem
            - Method=POST

        - id: staff-assignment
          uri: ${PARTNER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/partners/me/staff/{id}/team-member
            - Method=PUT,DELETE

        - id: staff-assignment-list
          uri: ${PARTNER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/partners/me/staff/team-members
            - Method=GET

        - id: admin-reception-customers
          uri: ${PARTNER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/admin/reception-customers,/api/v1/admin/reception-customers/{id}
            - Method=GET,HEAD

        - id: partner-categories
          uri: ${PARTNER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/categories/**

        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/bookings/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/payments/**

        - id: admin-notifications-read
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/admin/notifications,/api/v1/admin/notifications/{id}/attempts
            - Method=GET

        - id: admin-notifications-retry
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/admin/notifications/{id}/retry
            - Method=POST

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: never
    gateway:
      enabled: true

jwt:
  secret: ${JWT_SECRET:}

gateway:
  session:
    enabled: ${GATEWAY_SESSION_ENABLED:false}
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    timeout: ${GATEWAY_SESSION_TIMEOUT:3s}
