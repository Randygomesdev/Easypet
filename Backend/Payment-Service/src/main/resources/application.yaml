app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  checkout-enabled: ${APP_CHECKOUT_ENABLED:false}
  package-credits-enabled: ${APP_PACKAGE_CREDITS_ENABLED:false}
  booking-payment-authorization-token: ${BOOKING_PAYMENT_AUTHORIZATION_TOKEN:}

server:
  port: 8085
  servlet:
    context-path: /api/v1

spring:
  application:
    name: payment-service

  config:
    import:
      - optional:file:.env[.properties]

  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081/api/v1}
  partner-service:
    url: ${PARTNER_SERVICE_URL:http://localhost:8083/api/v1}
  booking-service:
    url: ${BOOKING_SERVICE_URL:http://localhost:8084/api/v1}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:TEST-ACCESS-TOKEN}
