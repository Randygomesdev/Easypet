app:
  package-credits-enabled: ${APP_PACKAGE_CREDITS_ENABLED:true}

server:
  port: 8085
  servlet:
    context-path: /api/v1

spring:
  application:
    name: payment-service

  config:
    import:
      - optional:file:.env[.properties]

  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}

services:
  partner-service:
    url: ${PARTNER_SERVICE_URL:http://localhost:8083/api/v1}
