services:
  auth-service:
    environment:
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_AUTHORIZATION_URI: http://localhost:${E2E_OAUTH_PROVIDER_PORT:?}/authorize
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_TOKEN_URI: http://oauth-provider:8090/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_JWK_SET_URI: http://oauth-provider:8090/jwks
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_ISSUER_URI: http://oauth-provider:8090

  oauth-edge:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${E2E_OAUTH_HTTPS_PORT:?}:443"
    volumes:
      - ./Frontend/e2e/nginx.oauth-fixture.conf:/etc/nginx/conf.d/default.conf:ro
      - ${E2E_OAUTH_TLS_DIR:?}:/tls:ro
    depends_on:
      frontend:
        condition: service_healthy

  oauth-provider:
    image: node:22-alpine
    command: ["node", "/fixture/provider.mjs"]
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?}
    ports:
      - "127.0.0.1:${E2E_OAUTH_PROVIDER_PORT:?}:8090"
    volumes:
      - ./Frontend/e2e/oauth-provider.mjs:/fixture/provider.mjs:ro
