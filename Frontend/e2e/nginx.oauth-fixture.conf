server {
    listen 443 ssl;
    ssl_certificate /tls/cert.pem;
    ssl_certificate_key /tls/key.pem;
    access_log off;
    error_log /dev/null emerg;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        set $frontend http://frontend:80;
        proxy_set_header Host $http_host;
        proxy_pass $frontend;
    }
}
