server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Resolve the container again when Compose replaces the gateway.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $gateway http://gateway-service:8080;

    location = /healthz {
        access_log off;
        return 204;
    }

    location ~* "^/api/.*;" {
        return 404;
    }

    location ~* ^/api/v1/auth/login$ {
        proxy_pass $gateway;
    }

    location ~* ^/api/v1/(auth|payments|internal)(/|$) {
        return 404;
    }

    location ~* ^/api/v1/partners/?$ {
        if ($request_method != POST) { return 404; }
        proxy_pass $gateway;
    }

    location = /api/v1/partners/catalog {
        proxy_pass $gateway;
    }

    location = /api/v1/partners/me {
        proxy_pass $gateway;
    }

    location ~* ^/api/v1/partners/[^/]+/?$ {
        if ($request_method ~ ^(GET|HEAD)$) { return 404; }
        proxy_pass $gateway;
    }

    location ~* ^/api/v1/partners/[^/]+/reviews(/|$) {
        return 404;
    }

    location /api/v1/ {
        proxy_pass $gateway;
    }

    location /api/ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
