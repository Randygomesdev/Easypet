log_format easypet_requests '$request_id $request_method $status $request_time $upstream_response_time';

map "${GOOGLE_AUTH_ENABLED}:$request_method:$uri" $google_oauth_allowed {
    default 0;
    ~^true:GET:/api/v1/oauth2/authorization/google$ 1;
    ~^true:GET:/api/v1/login/oauth2/code/google$ 1;
    ~^true:POST:/api/v1/auth/oauth2/exchange$ 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    set_real_ip_from ${HOMOLOG_TRUSTED_EDGE};
    real_ip_header X-Easypet-Edge-IP;
    real_ip_recursive off;
    access_log /var/log/nginx/access.log easypet_requests;
    add_header X-Request-Id $request_id always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Easypet-Client-IP $remote_addr;
    proxy_set_header X-Easypet-Ingress-Token "${HOMOLOG_INGRESS_TOKEN}";
    proxy_set_header X-Easypet-Edge-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_hide_header X-Request-Id;

    # Resolve the container again when Compose replaces the gateway.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $gateway http://gateway-service:8080;

    location = /healthz {
        access_log off;
        return 204;
    }

    location ~* ^/(actuator|oauth2)(/|$) {
        return 404;
    }

    location ~* "^/api/.*;" {
        return 404;
    }

    location = /api/v1/auth/login {
        if ($request_method != POST) { return 404; }
        proxy_pass $gateway;
    }

    location = /api/v1/auth/session {
        if ($request_method != GET) { return 404; }
        proxy_pass $gateway;
    }

    location ~ ^/api/v1/(oauth2/authorization/google|login/oauth2/code/google|auth/oauth2/exchange)$ {
        error_log /dev/null emerg;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header X-Request-Id $request_id always;
        proxy_hide_header Cache-Control;
        proxy_hide_header Referrer-Policy;
        if ($google_oauth_allowed = 0) { return 404; }
        proxy_pass $gateway;
    }

    location ~ "^/api/v1/auth/(forgot-password|reset-password(/validate)?|team/invitations(/accept)?)$" {
        if ($request_method != POST) { return 404; }
        proxy_pass $gateway;
    }

    location = /api/v1/auth/team/accesses {
        if ($request_method != GET) { return 404; }
        proxy_pass $gateway;
    }

    location ~ "^/api/v1/auth/team/accesses/[0-9a-fA-F-]{36}$" {
        if ($request_method != DELETE) { return 404; }
        proxy_pass $gateway;
    }

    location ~ "^/api/v1/admin/notifications(/[0-9a-fA-F-]{36}/attempts)?$" {
        if ($request_method != GET) { return 404; }
        proxy_pass $gateway;
    }

    location ~ "^/api/v1/admin/notifications/[0-9a-fA-F-]{36}/retry$" {
        if ($request_method != POST) { return 404; }
        proxy_pass $gateway;
    }

    location ~ "^/api/v1/payments/cashier/(context|charges(/[0-9a-fA-F-]{36}(/receipts)?)?|receipts/[0-9a-fA-F-]{36}/reverse|days(/[0-9]{4}-[0-9]{2}-[0-9]{2}/close)?)$" {
        proxy_pass $gateway;
    }

    location ~* ^/api/v1/(auth|payments|internal|oauth2|login)(/|$) {
        return 404;
    }

    location ~ ^/api/v1/admin/notifications(/|$) {
        return 404;
    }

    location ~* ^/api/v1/partners/?$ {
        if ($request_method != POST) { return 404; }
        proxy_pass $gateway;
    }

    location = /api/v1/partners/catalog {
        proxy_pass $gateway;
    }

    location = /api/v1/partners/me {
        proxy_pass $gateway;
    }

    location ~* ^/api/v1/partners/[^/]+/?$ {
        if ($request_method ~ ^(GET|HEAD)$) { return 404; }
        proxy_pass $gateway;
    }

    location ~* ^/api/v1/partners/[^/]+/reviews(/|$) {
        return 404;
    }

    location /api/v1/ {
        proxy_pass $gateway;
    }

    location /api/ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~ ^/login-success/?$ {
        error_log /dev/null emerg;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header X-Request-Id $request_id always;
        try_files $uri /index.html =404;
    }

    location ~ ^/(reset-password|team/invitation)/?$ {
        error_log /dev/stderr crit;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header X-Request-Id $request_id always;
        try_files $uri /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Request-Id $request_id always;
        try_files $uri $uri/ /index.html;
    }
}
