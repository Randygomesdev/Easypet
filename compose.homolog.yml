name: easypet-homolog

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

x-database: &database
  <<: *common
  image: postgres:15-alpine
  mem_limit: ${HOMOLOG_DB_MEMORY:-256m}
  healthcheck:
    test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc 'SELECT 1'"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 180s

x-java: &java
  <<: *common
  mem_limit: ${HOMOLOG_JAVA_MEMORY:-512m}
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8089/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 90s

x-java-env: &java-env
  JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env.homolog}
  SPRING_PROFILES_ACTIVE: prod
  MANAGEMENT_SERVER_PORT: '8089'
  MANAGEMENT_SERVER_ADDRESS: 127.0.0.1
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
  MANAGEMENT_HEALTH_MAIL_ENABLED: 'false'
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=55.0 -Duser.timezone=America/Sao_Paulo

services:
  frontend:
    <<: *common
    build:
      context: ./Frontend
      args:
        VITE_INTERNAL_SUPPORT_URL: ${HOMOLOG_SUPPORT_URL:-}
    environment:
      NGINX_ENVSUBST_FILTER: '^HOMOLOG_(TRUSTED_EDGE|INGRESS_TOKEN)$'
      HOMOLOG_TRUSTED_EDGE: ${HOMOLOG_TRUSTED_EDGE:-unix:}
      HOMOLOG_INGRESS_TOKEN: ${HOMOLOG_INGRESS_TOKEN:?defina HOMOLOG_INGRESS_TOKEN}
    mem_limit: 64m
    ports:
      - "127.0.0.1:${HOMOLOG_PORT:-18080}:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway-service:
    <<: *java
    build: ./Backend/Gateway-Service
    environment:
      <<: *java-env
      ALLOWED_ORIGINS: ${HOMOLOG_ORIGIN:?defina HOMOLOG_ORIGIN no .env.homolog}
      REDIS_HOST: redis
      AUTH_SERVICE_URL: http://auth-service:8081
      GATEWAY_SESSION_ENABLED: 'true'
      HOMOLOG_INGRESS_TOKEN: ${HOMOLOG_INGRESS_TOKEN:?defina HOMOLOG_INGRESS_TOKEN}
      PET_SERVICE_URL: http://pet-service:8082
      SERVER_FORWARD_HEADERS_STRATEGY: NONE
      PARTNER_SERVICE_URL: http://partner-service:8083
      BOOKING_SERVICE_URL: http://booking-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      pet-service:
        condition: service_healthy
      partner-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy

  auth-service:
    <<: *java
    build: ./Backend/Auth-Service
    environment:
      <<: *java-env
      AUTH_DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      AUTH_DB_USERNAME: auth
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?defina AUTH_DB_PASSWORD no .env.homolog}
      SPRING_PROFILES_ACTIVE: prod,homolog
      AUTH_S02_ENABLED: 'true'
      AUTH_MAIL_ENABLED: 'true'
      PARTNER_SERVICE_URL: http://partner-service:8083/api/v1
      FRONTEND_URL: ${HOMOLOG_ORIGIN}
      AUTH_TEAM_JWT_SECRET: ${AUTH_TEAM_JWT_SECRET:?defina AUTH_TEAM_JWT_SECRET}
      NOTIFICATION_RECIPIENT_TOKEN: ${NOTIFICATION_RECIPIENT_TOKEN:?defina NOTIFICATION_RECIPIENT_TOKEN}
      RECEPTION_CLAIM_TOKEN: ${RECEPTION_CLAIM_TOKEN:?defina RECEPTION_CLAIM_TOKEN}
      MAIL_HOST: smtp-capture
      MAIL_PORT: '1025'
      MAIL_FROM: auth@example.test
      MAIL_SMTP_AUTH: 'false'
      MAIL_STARTTLS_ENABLED: 'false'
    networks: [default, mail]
    depends_on:
      auth-db:
        condition: service_healthy
      smtp-capture:
        condition: service_healthy

  pet-service:
    <<: *java
    build: ./Backend/Pet-Service
    environment:
      <<: *java-env
      PET_DB_URL: jdbc:postgresql://pet-db:5432/pet_db
      PET_DB_USERNAME: pet
      PET_DB_PASSWORD: ${PET_DB_PASSWORD:?defina PET_DB_PASSWORD no .env.homolog}
      SPRING_DATA_REDIS_HOST: redis
      BOOKING_SERVICE_URL: http://booking-service:8084/api/v1
      AUTH_SERVICE_URL: http://auth-service:8081/api/v1
      PARTNER_SERVICE_URL: http://partner-service:8083/api/v1
      BOOKING_PET_SUMMARY_TOKEN: ${BOOKING_PET_SUMMARY_TOKEN:?defina BOOKING_PET_SUMMARY_TOKEN}
    depends_on:
      pet-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  partner-service:
    <<: *java
    build: ./Backend/Partner-Service
    environment:
      <<: *java-env
      PARTNER_DB_URL: jdbc:postgresql://partner-db:5432/partner_db
      PARTNER_DB_USERNAME: partner
      PARTNER_DB_PASSWORD: ${PARTNER_DB_PASSWORD:?defina PARTNER_DB_PASSWORD no .env.homolog}
      AUTH_SERVICE_URL: http://auth-service:8081/api/v1
      RECEPTION_CLAIM_TOKEN: ${RECEPTION_CLAIM_TOKEN}
      BOOKING_PET_SUMMARY_TOKEN: ${BOOKING_PET_SUMMARY_TOKEN}
    depends_on:
      partner-db:
        condition: service_healthy

  booking-service:
    <<: *java
    build: ./Backend/Booking-Service
    environment:
      <<: *java-env
      BOOKING_DB_URL: jdbc:postgresql://booking-db:5432/booking_db
      BOOKING_DB_USERNAME: booking
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?defina BOOKING_DB_PASSWORD no .env.homolog}
      AUTH_SERVICE_URL: http://auth-service:8081/api/v1
      PARTNER_SERVICE_URL: http://partner-service:8083/api/v1
      PAYMENT_SERVICE_URL: http://payment-service:8085/api/v1
      PET_SERVICE_URL: http://pet-service:8082/api/v1
      BOOKING_OUTBOX_TOKEN: ${BOOKING_OUTBOX_TOKEN:?defina BOOKING_OUTBOX_TOKEN}
      BOOKING_PET_SUMMARY_TOKEN: ${BOOKING_PET_SUMMARY_TOKEN}
      BOOKING_ZONE: America/Sao_Paulo
      APP_PACKAGE_CREDITS_ENABLED: 'false'
    depends_on:
      booking-db:
        condition: service_healthy

  payment-service:
    <<: *java
    build: ./Backend/Payment-Service
    environment:
      <<: *java-env
      PAYMENT_DB_URL: jdbc:postgresql://payment-db:5432/payment_db
      PAYMENT_DB_USERNAME: payment
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?defina PAYMENT_DB_PASSWORD no .env.homolog}
      AUTH_SERVICE_URL: http://auth-service:8081/api/v1
      PARTNER_SERVICE_URL: http://partner-service:8083/api/v1
      BOOKING_SERVICE_URL: http://booking-service:8084/api/v1
      APP_CHECKOUT_ENABLED: 'false'
      APP_PACKAGE_CREDITS_ENABLED: 'false'
    depends_on:
      payment-db:
        condition: service_healthy

  notification-service:
    <<: *java
    build: ./Backend/Notification-Service
    environment:
      MANAGEMENT_SERVER_PORT: '8089'
      MANAGEMENT_SERVER_ADDRESS: 127.0.0.1
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=55.0 -Duser.timezone=America/Sao_Paulo
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-db:5432/notification_db
      NOTIFICATION_DB_USERNAME: notification
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?defina NOTIFICATION_DB_PASSWORD}
      NOTIFICATION_TRANSPORT: SMTP
      NOTIFICATION_BOOKING_ZONE: America/Sao_Paulo
      BOOKING_OUTBOX_TOKEN: ${BOOKING_OUTBOX_TOKEN}
      BOOKING_SERVICE_URL: http://booking-service:8084/api/v1
      AUTH_SERVICE_URL: http://auth-service:8081/api/v1
      NOTIFICATION_RECIPIENT_TOKEN: ${NOTIFICATION_RECIPIENT_TOKEN}
      NOTIFICATION_MAIL_HOST: smtp-capture
      NOTIFICATION_MAIL_PORT: '1025'
      NOTIFICATION_MAIL_FROM: notifications@example.test
      NOTIFICATION_MAIL_SMTP_AUTH: 'false'
      NOTIFICATION_MAIL_STARTTLS_REQUIRED: 'false'
    networks: [default, mail]
    depends_on:
      notification-db:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      smtp-capture:
        condition: service_healthy

  smtp-capture:
    <<: *common
    image: node:22-alpine
    user: node
    mem_limit: 96m
    command: ["node", "/capture/smtp-capture.mjs"]
    volumes:
      - ./Backend/Infra/smtp/smtp-capture.mjs:/capture/smtp-capture.mjs:ro
    networks: [mail]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8025/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 10

  auth-db:
    <<: *database
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?defina AUTH_DB_PASSWORD no .env.homolog}
    volumes:
      - auth-data:/var/lib/postgresql/data

  pet-db:
    <<: *database
    environment:
      POSTGRES_DB: pet_db
      POSTGRES_USER: pet
      POSTGRES_PASSWORD: ${PET_DB_PASSWORD:?defina PET_DB_PASSWORD no .env.homolog}
    volumes:
      - pet-data:/var/lib/postgresql/data

  partner-db:
    <<: *database
    environment:
      POSTGRES_DB: partner_db
      POSTGRES_USER: partner
      POSTGRES_PASSWORD: ${PARTNER_DB_PASSWORD:?defina PARTNER_DB_PASSWORD no .env.homolog}
    volumes:
      - partner-data:/var/lib/postgresql/data

  booking-db:
    <<: *database
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:?defina BOOKING_DB_PASSWORD no .env.homolog}
    volumes:
      - booking-data:/var/lib/postgresql/data

  payment-db:
    <<: *database
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?defina PAYMENT_DB_PASSWORD no .env.homolog}
    volumes:
      - payment-data:/var/lib/postgresql/data

  notification-db:
    <<: *database
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - notification-data:/var/lib/postgresql/data

  redis:
    <<: *common
    image: redis:7.2-alpine
    mem_limit: 128m
    command: ["redis-server", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  auth-data:
  pet-data:
  partner-data:
  booking-data:
  payment-data:
  notification-data:

networks:
  mail:
    internal: true
