# Install only during the DNS/certificate preparation stage.
# Never enable alongside nginx-https.conf: both own the same HTTP server name.
server {
    listen 80;
    server_name easypet.innker.com.br;
    server_tokens off;
    access_log off;
    error_log /dev/null emerg;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/easypet-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
