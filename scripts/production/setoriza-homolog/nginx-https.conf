# Dedicated site for the existing HOST Nginx (Ubuntu 1.24).
# Preserve the Setoriza vhost. Install access policy before enabling this file.
log_format easypet_edge '$time_iso8601 $request_id $request_method $status '
                        '$request_time $upstream_response_time';

server {
    listen 80;
    server_name easypet.innker.com.br;
    server_tokens off;
    access_log off;
    error_log /dev/null emerg;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/easypet-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://easypet.innker.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name easypet.innker.com.br;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/easypet.innker.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easypet.innker.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    include /etc/nginx/snippets/easypet-access.conf;
    access_log /var/log/nginx/easypet.access.log easypet_edge;
    # Nginx error logs can contain request URLs, including OAuth/reset codes.
    error_log /dev/null emerg;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host easypet.innker.com.br;
        proxy_set_header Connection "";
        proxy_set_header X-Easypet-Edge-IP $remote_addr;
        proxy_set_header X-Easypet-Client-IP "";
        proxy_set_header X-Easypet-Ingress-Token "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_redirect off;
        proxy_cache off;
        # Authorization, Origin, Cookie, Set-Cookie and Location pass unchanged.
        # The inner Nginx owns no-store/no-referrer; avoid duplicate headers here.
    }
}
